schema: spec-driven
context: |
  ## 本项目｜tech stack / 约定（每个项目自填；新项目替换本段）
  temp-monitor：温度监控教学示例。命中领域：backend·go。
  - Tech stack：Go 1.27，PostgreSQL 18（测过的主版本写进 README）。
  - 模块只有四个：设备注册与注销、上报入库、超温告警写日志、一套测试脚本。不加表外功能。
  - 设备用脚本模拟上报，直接调服务的上报接口。不接 MQTT，不接真硬件。
  - 存储层：一个存储接口，一个内存假实现（单元测试用），一个 PostgreSQL 实现（连真库的测试用）。
  - 测试脚本统一入口，输出一行汇总「N passed, M failed, K skipped (T total)」，退出码跟随失败数。
  - 连真库的测试在连不上库时失败，不跳过。
  - 连接配置从不进 git 的本地文件或环境变量读，仓里只放占位值的示例配置。
  - 建库脚本只接受固定演示库名，其它库名拒绝执行。
  - 教学示例，无鉴权，服务默认监听 127.0.0.1。
  - 禁止：凭据、真实主机地址、公司名、客户名、内网 IP 写进仓或提交历史。
